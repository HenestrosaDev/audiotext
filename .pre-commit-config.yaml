repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-vcs-permalinks
      - id: debug-statements
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: no-commit-to-branch
        args: [ --branch, main ]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: mypy-local
        name: Run mypy with all dev dependencies present
        language: system
        types:
          - python
        entry: uv run --no-sync mypy --strict
        exclude: ^tests/
        # Parallel runs share the cache, which makes mypy crash when it's empty
        require_serial: true
      - id: compile-translations
        name: Compile the translations and check their placeholders
        language: python
        additional_dependencies: [ babel==2.18.0 ]
        entry: python .github/scripts/compile_translations.py
        files: ^res/locales/.*\.(po|mo)$
        pass_filenames: false
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      # Checks that `uv.lock` is up to date with `pyproject.toml`
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
