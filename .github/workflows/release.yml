name: Release

# Builds the installers of the app and attaches them to a draft release when a version
# tag is pushed (e.g. `v2.4.0`, or `v2.4.0-rc.1` for a pre-release). The tag must match
# the version of `pyproject.toml`.
#
# - macOS (Apple Silicon): `.dmg`.
# - Windows (x64): `-setup.exe`, which offers to download the GPU add-on.
# - Linux (x86_64): `.tar.gz` with `install.sh`, which offers to download the GPU add-on.
#
# Each file is created by a script of `packaging/`, which can also be run locally.
# The GPU add-on (`-gpu-N.*` files) turns the CPU build into the CUDA one, so the
# installers stay small for those who don't have an NVIDIA GPU
# (see `.github/scripts/make_gpu_addon.py`).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the version of pyproject.toml
        id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version $version of pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # PyTorch doesn't support Intel Macs anymore, and CUDA isn't available on macOS
          - os: macos-15
            platform: macos-arm64
            gpu: false
          - os: windows-2025
            platform: windows-x64
            gpu: true
          # The oldest Ubuntu available, so the app runs on more distributions
          - os: ubuntu-22.04
            platform: linux-x86_64
            gpu: true
    defaults:
      run:
        shell: bash
    env:
      NAME: Audiotext-${{ needs.version.outputs.version }}-${{ matrix.platform }}
      URL_BASE: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for the CUDA build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # The Python of setup-python, with Tcl/Tk 8.6. The ones that uv downloads have Tk 9,
      # which the tkinter of Python 3.10 doesn't support, and the one of Ubuntu lacks tkinter
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.12"
      # Without the cache, since the CUDA build of PyTorch would take most of it
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ steps.setup-python.outputs.python-path }}
      # FFmpeg and FFprobe are bundled with the app
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 ffmpeg
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg innosetup --no-progress -y
          # Chocolatey adds shims to PATH, which run the executables from where the package
          # is installed and so only work on this computer. The actual ones are bundled
          echo "$ChocolateyInstall"'\lib\ffmpeg\tools\ffmpeg\bin' >> "$GITHUB_PATH"

      - name: Build the GPU version
        if: matrix.gpu
        run: bash .github/scripts/build_bundle.sh gpu cuda
      - name: Build the CPU version
        run: bash .github/scripts/build_bundle.sh cpu cpu
      - name: Create the GPU add-on
        if: matrix.gpu
        run: |
          uv run --no-project python .github/scripts/make_gpu_addon.py \
            --cpu build/cpu/Audiotext \
            --gpu build/gpu/Audiotext \
            --out build/release \
            --name "$NAME-gpu" \
            --format ${{ runner.os == 'Windows' && '7z' || 'tar.xz' }} \
            --url-base "$URL_BASE" \
            --manifest build/gpu-addon.txt \
            --iss build/gpu-addon.iss
          rm -rf build/gpu

      # The same scripts that create the files locally (see `packaging/`)
      - name: Create the disk image (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos.sh build/cpu/Audiotext.app build/release
      # PowerShell, since Git Bash would mangle the /D arguments as if they were paths
      - name: Create the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1
          & $iscc.FullName "/DBundleDir=$PWD\build\cpu\Audiotext" "/DOutputDir=$PWD\build\release" `
            "/DGpuAddon=$PWD\build\gpu-addon.iss" packaging\windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Create the archive (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux.sh build/cpu/Audiotext build/release build/gpu-addon.txt

      - name: Upload the release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: build/release/
          # They're already compressed
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Create the checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt
      # A draft, so the notes can be reviewed before publishing it. The installers
      # can download the GPU add-on once it's published
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--draft --generate-notes --verify-tag --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
