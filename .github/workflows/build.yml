name: Build

# Checks that the app can be packaged with PyInstaller on each system, so a change
# of the dependencies or of the spec doesn't break the releases unnoticed
on:
  pull_request:
    branches:
      - "**"
    paths:
      - "src/**"
      - "audiotext.spec"
      - "uv.lock"
      - "res/**"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - "packaging/macos/build_ffmpeg.sh"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "audiotext.spec"
      - "uv.lock"
      - "res/**"
      - "pyproject.toml"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - "packaging/macos/build_ffmpeg.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      # The Python of setup-python, with Tcl/Tk 8.6. The ones that uv downloads have Tk 9,
      # which the tkinter of Python 3.10 doesn't support, and the one of Ubuntu lacks tkinter
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ steps.setup-python.outputs.python-path }}
          enable-cache: true
      # FFmpeg and FFprobe are bundled with the app
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 ffmpeg xvfb
      # The FFmpeg of Homebrew can't draw subtitles, so an LGPL build with libass
      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build_ffmpeg.sh "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --no-progress -y
          # Chocolatey adds shims to PATH, which run the executables from where the package
          # is installed and so only work on this computer. The actual ones are bundled
          echo "$ChocolateyInstall"'\lib\ffmpeg\tools\ffmpeg\bin' >> "$GITHUB_PATH"
      # The CPU build of PyTorch, which is much smaller
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group build --group cpu
      - name: Build
        run: uv run --no-sync pyinstaller audiotext.spec --noconfirm
      # On Windows, the app shows a dialog instead of closing when it fails to open, so
      # it can only be checked on the other systems
      - name: Check that the app opens (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum uv run --no-sync python .github/scripts/smoke_test_app.py dist/Audiotext/Audiotext
      - name: Check that the app opens (macOS)
        if: runner.os == 'macOS'
        run: uv run --no-sync python .github/scripts/smoke_test_app.py dist/Audiotext.app/Contents/MacOS/Audiotext
      # The FFmpeg of the app, with the libraries it bundles, draws the subtitles of
      # several scripts with the fonts of the system. Linux runners have no font of
      # Chinese and Japanese, which the desktops have
      - name: Install the fonts of Chinese and Japanese (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Check that the app burns subtitles
        run: >
          uv run --no-sync python .github/scripts/smoke_test_burn.py
          ${{ runner.os == 'macOS' && 'dist/Audiotext.app' || 'dist/Audiotext' }}
          build/smoke-test-burn
      - name: Upload the frames with subtitles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subtitles-${{ runner.os }}
          path: build/smoke-test-burn/frames.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: Audiotext-${{ runner.os }}
          path: dist/
          retention-days: 7
